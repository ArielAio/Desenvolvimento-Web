<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <link rel="stylesheet" href="/ex03/style/tableStyle.css">
</head>
<body>
    <h1>Praticando 2 - Tabela grande com colspan e rowspan e planos de fundo</h1>
    
    <h2>Tabela grande com colspan e rowspan</h2>
    <table>
        <tr>
            <td class="green" colspan="2">Colspan</td>
            <td class="green">-</td>
            <td class="green" rowspan="3">Rowspan</td>
        </tr>
        <tr>
            <td class="red">-</td>
            <td class="red">-</td>
            <td class="red">-</td>
        </tr>
        <tr>
            <td class="blue">-</td>
            <td class="blue" colspan="2">Colspan</td>
        </tr>
        <tr>
            <td class="yellow">-</td>
            <td class="yellow">-</td>
            <td class="yellow">-</td>
            <td class="yellow">-</td>
        </tr>
    </table>

    <h2>Legenda</h2>
    <table class="legend">
        <tr>
            <td>Linha 1</td>
            <td class="legend-color green">--------</td>
            <td>green</td>
        </tr>
        <tr>
            <td>Linha 2</td>
            <td class="legend-color red">--------</td>
            <td>red</td>
        </tr>
        <tr>
            <td>Linha 3</td>
            <td class="legend-color blue">--------</td>
            <td>blue</td>
        </tr>
        <tr>
            <td>Linha 4</td>
            <td class="legend-color yellow">--------</td>
            <td>yellow</td>
        </tr>
    </table>
</body>
</html>
